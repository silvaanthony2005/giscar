[project]
name = "giscar-backend"
version = "0.1.0"
description = "GCISCAR - Sistema de informacion interno por departamentos"
readme = "README.md"
authors = [
    { name = "silvaanthony2005", email = "silvaanthony2005gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "reportlab>=4.2.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    "pywebview>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pyinstaller>=6.0",
]

[project.scripts]
giscar-backend = "app.main:run"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]
ignore = ["E501", "B008", "UP046", "UP047", "UP007"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = [".venv", "uploads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
